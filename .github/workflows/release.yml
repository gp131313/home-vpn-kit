name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4

      - name: Version in the sources matches the tag
        run: |
          $v = $env:GITHUB_REF_NAME.TrimStart('v')
          $bad = @()
          if (-not (Select-String -Path install.ps1 -Pattern "^\`$KitVersion\s*=\s*'$([regex]::Escape($v))'" -Quiet)) { $bad += 'install.ps1: $KitVersion' }
          if (-not (Select-String -Path setup/Setup.cs -Pattern "public const string Version = `"$([regex]::Escape($v))`"" -Quiet)) { $bad += 'setup/Setup.cs: Version' }
          if (-not (Select-String -Path setup/Setup.cs -Pattern "AssemblyFileVersion\(`"$([regex]::Escape($v))\.0`"\)" -Quiet)) { $bad += 'setup/Setup.cs: AssemblyFileVersion' }
          if ($bad) { $bad | ForEach-Object { Write-Host "::error::$_ is not $v" }; exit 1 }

      - name: Build HomeVpnKit-Setup.exe (setup\build.ps1)
        run: powershell -NoProfile -ExecutionPolicy Bypass -File setup\build.ps1

      - name: Build zip and checksums
        run: |
          $name = "home-vpn-kit-$env:GITHUB_REF_NAME"
          $stage = Join-Path $env:RUNNER_TEMP $name
          New-Item -ItemType Directory -Path $stage -Force | Out-Null
          # the archive = the repository tree minus docs, setup and the build output (Install.cmd at the root, as get.ps1 expects)
          git ls-files | Where-Object { $_ -notmatch '^(docs|setup)/' } | ForEach-Object {
            $dst = Join-Path $stage $_
            New-Item -ItemType Directory -Path (Split-Path $dst) -Force | Out-Null
            Copy-Item $_ $dst
          }
          Compress-Archive -Path (Join-Path $stage '*') -DestinationPath "dist\$name.zip" -Force
          Set-Location dist
          $sums = foreach ($f in 'HomeVpnKit-Setup.exe', 'HomeVpnKit-Setup-Silent.exe', "$name.zip") {
            '{0}  {1}' -f (Get-FileHash $f -Algorithm SHA256).Hash.ToLower(), $f
          }
          [IO.File]::WriteAllText((Join-Path $PWD 'SHA256SUMS.txt'), (($sums -join "`n") + "`n"))
          Get-Content SHA256SUMS.txt

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = $env:GITHUB_REF_NAME
          $notes = "docs/releases/$tag.md"
          $assets = @("dist/HomeVpnKit-Setup.exe", "dist/HomeVpnKit-Setup-Silent.exe", "dist/home-vpn-kit-$tag.zip", "dist/SHA256SUMS.txt")
          if (Test-Path $notes) {
            $title = (Get-Content $notes -First 1) -replace '^\*\*|\*\*$|\.$', ''
            gh release create $tag @assets --title "$tag — $title" --notes-file $notes
          } else {
            gh release create $tag @assets --title $tag --generate-notes
          }
